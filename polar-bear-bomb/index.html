<style>
  html, body { margin: 0; height: 100%; background: #747a86; overflow: hidden; overscroll-behavior: none; }
  canvas { display: block; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 0; }

  #hud { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; max-width: calc(100vw - 16px); }
  .chip { display: flex; align-items: center; gap: 5px; padding: 5px 11px; border: 3px solid #fff; border-radius: 999px; background: linear-gradient(#ffffff, #dcecff); font-size: 14px; box-shadow: 0 4px 0 #27468f, 0 7px 10px #0b163a44; white-space: nowrap; }
  .chip b { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--c); color: #fff; }

  .overlay { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; background: #33304a70; }
  .card { width: min(560px, 100%); box-sizing: border-box; padding: 24px; border-radius: 24px; background: #fff; text-align: center; }
  .card h1 { margin: 0 0 6px; color: #27468f; font-size: 36px; font-weight: 400; }

  .level:not(:disabled):hover, .level:focus-visible { border-color: #7b4fd0; transform: translateY(-2px); }
  .level:disabled { cursor: not-allowed; opacity: .72; }

  .level small { padding: 0 8px; color: #66627c; }
  .thumb { position: relative; display: block; aspect-ratio: 16 / 10; background-repeat: no-repeat; }
  .tag { position: absolute; top: 8px; right: 8px; padding: 3px 9px; border-radius: 999px; color: #fff; font-size: 12px; font-weight: 700; }

  .title-screen { background: linear-gradient(#1c2b5acc, #1c2b5a55 45%, #1c2b5acc), url('assets/level1-background-ice.webp') center / cover; }
  .title-wrap { width: min(860px, 100%); text-align: center; color: #fff; }
  body:not(.loaded) .title-wrap { visibility: hidden; }
  #loader { position: fixed; top: 50%; left: 50%; z-index: 3; width: 52px; height: 52px; margin: -26px 0 0 -26px; box-sizing: border-box; border: 6px solid #ffffff55; border-top-color: #fff; border-radius: 50%; animation: loaderSpin .9s linear infinite; }
  body.loaded #loader { display: none; }
  @keyframes loaderSpin { to { transform: rotate(360deg); } }
  .game-title { display: grid; margin: 0 0 6px; color: #fff; line-height: 1.04; font-weight: 400; font-size: clamp(42px, 8vw, 86px); letter-spacing: .03em; -webkit-text-stroke: 7px #17306f; paint-order: stroke fill;  }
    .game-title span { filter: drop-shadow(0 6px 0 #17306f) drop-shadow(0 11px 10px #0b163a99); }
  .game-title i { display: inline-block; padding: 0 .02em; font-style: normal; color: #ffffff; animation: titleBob 2.6s ease-in-out infinite; }
  .game-title span:last-child i { color: #ffd63f; }
  .game-title i:nth-child(odd) { transform: rotate(-4deg); animation-delay: -.5s; }
  .game-title i:nth-child(even) { transform: rotate(4deg) translateY(4px); animation-delay: -1.4s; }
  @keyframes titleBob { 50% { translate: 0 -5px; } }
  @media (prefers-reduced-motion: reduce) { .game-title i { animation: none; } }
  .game-logo { display: block; width: min(640px, 92%); max-height: 34vh; margin: 0 auto 4px; object-fit: contain; animation: logoBob 3s ease-in-out infinite; filter: drop-shadow(0 10px 14px #0b163a66); }
  @keyframes logoBob { 50% { translate: 0 -6px; } }
  @media (prefers-reduced-motion: reduce) { .game-logo { animation: none; } }
  .title-sub { margin: 10px 0 16px; font-size: 18px; font-weight: 600; text-shadow: 0 1px 6px #0b163a; }
  #picks { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 16px; }
  .pick { position: relative; display: grid; justify-items: center; gap: 4px; padding: 12px 6px 12px; border: 3px solid transparent; border-radius: 22px; background: #ffffff33; color: #fff; font: inherit; cursor: pointer; backdrop-filter: blur(3px); transition: transform .15s, background .15s; }
  .pick:hover, .pick:focus-visible { background: #ffffff55; transform: translateY(-3px); outline: none; }
  .pick[aria-pressed="true"] { border-color: var(--c); background: #ffffffe8; color: #33304a; transform: translateY(-5px) scale(1.03); box-shadow: 0 10px 24px #0b163a66; }
  .pick b { display: block; width: 100%; height: clamp(92px, 18vw, 146px); overflow: hidden; }
  .pick b img { display: block; width: 100%; height: 100%; object-fit: contain; object-position: center bottom; min-height: 0; }
  .pick strong { font-size: 17px; overflow-wrap: anywhere; }
  .pick small { color: inherit; opacity: .82; }
  .name-form { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 10px; padding: 12px 16px; border-radius: 999px; background: #ffffffec; color: #33304a; }

  .title-wrap .keys { margin: 14px 0 0; color: #fff; font-size: 13px; text-shadow: 0 1px 5px #0b163a; }
  #hud, #mute { display: none; }
  body.playing #hud { display: flex; }
  body.playing #mute { display: block; }
  @media (max-width: 560px) { #picks { grid-template-columns: repeat(2, 1fr); } .name-form { border-radius: 24px; } }

  .row button.ghost { background: linear-gradient(#ffffff, #dcecff); color: #27468f; text-shadow: none; box-shadow: 0 5px 0 #27468f, 0 8px 12px #0b163a44; }
  [hidden] { display: none !important; }
  #pad { position: fixed; left: 14px; bottom: 14px; display: none; grid-template-columns: repeat(3, 58px); grid-template-rows: repeat(3, 58px); gap: 4px; }
  #pad button, #drop { border: 0; border-radius: 16px; background: #ffffffd9; color: #33304a; font-size: 24px; touch-action: none; }
  #drop { position: fixed; right: 18px; bottom: 34px; display: none; width: 104px; height: 104px; border-radius: 50%; background: #1f2a55e6; color: #fff; font-size: 18px; font-weight: 700; }
  body.playing #pad { display: grid; }
  body.playing #drop { display: block; }
  @media (pointer: fine) {
    #pad { left: 8px; bottom: 8px; grid-template-columns: repeat(3, 38px); grid-template-rows: repeat(3, 38px); gap: 2px; opacity: .85; }

  body.playing #pause { display: block; }
  @media (pointer: coarse) {
    #pad button { background: #ffffff; color: #27468f; border: 2px solid #27468f; box-shadow: 0 3px 0 #27468f; }
  }
  #pad button.on { background: #ffd34d; }
  @media (pointer: coarse) and (orientation: landscape) {
    #pad { left: 12px; bottom: 10px; grid-template-columns: repeat(3, 44px); grid-template-rows: repeat(3, 44px); gap: 2px; opacity: .95; pointer-events: none; }

  }

    .chip:not(.me) span { display: none; }
  }

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
const MAPS = [
  ['1..O.O..2', '.#.#O#.#.', '..O.@.O..', 'O#.#.#.#O', '@.O...O.@', '.#.#O#.#.', '3..O@O..4'],
  ['1..O.O..2', '.#.#O#.#.', '.~O.~.O~.', 'O#.#.#.#O', '.~O.~.O~.', '.#.#O#.#.', '3..O.O..4'],
  ['1..O.O..2', '.#.#O#.#.', '.=O.=.O=.', 'O#.#.#.#O', '.=O.=.O=.', '.#.#O#.#.', '3..O.O..4'],
];
let MAP = MAPS[0];
const isOpen = (c, r) => (MAP[r]?.[c] ?? ' ') !== ' ';
const COLS = 9, ROWS = 7;
const PALETTE = {
  snow: 0xfff8f4, distance: 0xe4e8ee,
  fixed: 0x7b4fd0, breakable: 0xff8a1e, bomb: 0x1f2a55, border: 0xe7dff2,
};
const OUTER_COLORS = [0xe5565a, 0x4a90d9, 0x45b27a, 0xf07da6];
const cellX = c => c - (COLS - 1) / 2;
const cellZ = r => r - (ROWS - 1) / 2;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x747a86);
const camera = new THREE.PerspectiveCamera(27, 16 / 9, 0.1, 150);
const IS_TOUCH = matchMedia('(pointer: coarse)').matches;
const renderer = new THREE.WebGLRenderer({ antialias: !IS_TOUCH, powerPreference: IS_TOUCH ? 'low-power' : 'default' });
renderer.setPixelRatio(Math.min(devicePixelRatio, IS_TOUCH ? 1.25 : 2));
renderer.shadowMap.enabled = true;
renderer.localClippingEnabled = true;
const GROUND_CLIP = [new THREE.Plane(new THREE.Vector3(0, 1, 0), 0)];
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xfff4ea, 0xffc6b0, 1.25));
const sun = new THREE.DirectionalLight(0xfff0d0, 2.4);
sun.position.set(-7, 14, 6);
sun.castShadow = true;
sun.shadow.mapSize.set(IS_TOUCH ? 1024 : 2048, IS_TOUCH ? 1024 : 2048);
Object.assign(sun.shadow.camera, { left: -20, right: 20, top: 18, bottom: -18, far: 50 });
sun.shadow.bias = -0.0005;
scene.add(sun);

const mat = (color, roughness = 0.65) => new THREE.MeshStandardMaterial({ color, roughness });
function roundedBox(w, h, d, r) {
  const hw = w / 2 - r, hd = d / 2 - r, c = Math.min(hw, hd) * 0.5;
  const s = new THREE.Shape();
  s.moveTo(-hw + c, -hd);
  s.lineTo(hw - c, -hd); s.quadraticCurveTo(hw, -hd, hw, -hd + c);
  s.lineTo(hw, hd - c); s.quadraticCurveTo(hw, hd, hw - c, hd);
  s.lineTo(-hw + c, hd); s.quadraticCurveTo(-hw, hd, -hw, hd - c);
  s.lineTo(-hw, -hd + c); s.quadraticCurveTo(-hw, -hd, -hw + c, -hd);
  const g = new THREE.ExtrudeGeometry(s, {
    depth: h - 2 * r, bevelEnabled: true, bevelThickness: r, bevelSize: r, bevelSegments: 4, curveSegments: 6,
  });
  g.rotateX(-Math.PI / 2);
  g.translate(0, r, 0);
  return g;
}
function mesh(geometry, material, x = 0, y = 0, z = 0) {
  const m = new THREE.Mesh(geometry, material);
  m.position.set(x, y, z);
  m.castShadow = true;
  m.receiveShadow = true;
  return m;
}

function buildGridOverlay() {
  const pts = [];
  MAP.forEach((row, r) => [...row].forEach((ch, c) => {
    if (!isOpen(c, r)) return;
    const x = cellX(c), z = cellZ(r), y = 0.012;
    pts.push(x - 0.5, y, z - 0.5, x + 0.5, y, z - 0.5, x - 0.5, y, z - 0.5, x - 0.5, y, z + 0.5);
    if (!isOpen(c + 1, r)) pts.push(x + 0.5, y, z - 0.5, x + 0.5, y, z + 0.5);
    if (!isOpen(c, r + 1)) pts.push(x - 0.5, y, z + 0.5, x + 0.5, y, z + 0.5);
  }));
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
  dynamic.add(new THREE.LineSegments(g, new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.32 })));
}

function blobShadow(x, z, radius) {
  const m = new THREE.Mesh(new THREE.CircleGeometry(radius, 20), new THREE.MeshBasicMaterial({ color: 0x4b5068, transparent: true, opacity: 0.2, depthWrite: false }));
  m.rotation.x = -Math.PI / 2;
  m.position.set(x, 0.012, z);
  scene.add(m);
}

function snowman(x, z, size = 1) {
  const g = new THREE.Group();
  const white = mat(0xfffdf9, 0.8);
  g.add(mesh(new THREE.SphereGeometry(0.24, 18, 14), white, 0, 0.2, 0));
  g.add(mesh(new THREE.SphereGeometry(0.17, 18, 14), white, 0, 0.5, 0));
  [-0.06, 0.06].forEach(ex => g.add(mesh(new THREE.SphereGeometry(0.022, 8, 8), mat(0x22242c, 0.3), ex, 0.56, 0.145)));
  g.add(mesh(new THREE.ConeGeometry(0.035, 0.15, 10).rotateX(Math.PI / 2), mat(0xff8a1e, 0.5), 0, 0.52, 0.2));
  g.add(mesh(new THREE.TorusGeometry(0.13, 0.035, 8, 18).rotateX(Math.PI / 2), mat(0xe5484d, 0.7), 0, 0.42, 0));
  g.add(mesh(new THREE.CylinderGeometry(0.11, 0.13, 0.13, 16), mat(0x34394a, 0.5), 0, 0.72, 0));
  g.add(mesh(new THREE.CylinderGeometry(0.17, 0.17, 0.02, 16), mat(0x34394a, 0.5), 0, 0.66, 0));
  g.position.set(x, 0, z);
  g.scale.setScalar(size);
  scene.add(g);
  blobShadow(x, z, 0.26 * size);
}

function snowDrift(x, z, width, depth, height) {
  blobShadow(x, z, Math.max(width, depth) * 0.6);
  const m = mesh(new THREE.SphereGeometry(1, 16, 12), mat(0xfffdf9, 0.9), x, 0, z);
  m.scale.set(width / 2, height, depth / 2);
  scene.add(m);
}

function roundedShape(hw, hd, r) {
  const s = new THREE.Shape();
  s.moveTo(-hw + r, -hd);
  s.lineTo(hw - r, -hd); s.absarc(hw - r, -hd + r, r, -Math.PI / 2, 0);
  s.lineTo(hw, hd - r); s.absarc(hw - r, hd - r, r, 0, Math.PI / 2);
  s.lineTo(-hw + r, hd); s.absarc(-hw + r, hd - r, r, Math.PI / 2, Math.PI);
  s.lineTo(-hw, -hd + r); s.absarc(-hw + r, -hd + r, r, Math.PI, Math.PI * 1.5);
  return s;
}

function iceTexture(w, h) {
  const c = document.createElement('canvas');
  c.width = 2048; c.height = Math.round(2048 * h / w);
  const x = c.getContext('2d');
  const base = x.createLinearGradient(0, 0, c.width, c.height);
  base.addColorStop(0, '#a9dcec'); base.addColorStop(0.45, '#c9edf5'); base.addColorStop(1, '#9fd4e8');
  x.fillStyle = base;
  x.fillRect(0, 0, c.width, c.height);
  const patch = (color, n, min, max) => {
    for (let i = 0; i < n; i++) {
      const px = Math.random() * c.width, py = Math.random() * c.height, r = min + Math.random() * (max - min);
      const g = x.createRadialGradient(px, py, 0, px, py, r);
      g.addColorStop(0, color);
      g.addColorStop(1, 'rgba(255,255,255,0)');
      x.fillStyle = g;
      x.fillRect(px - r, py - r, r * 2, r * 2);
    }
  };
  patch('rgba(70,160,205,0.28)', 34, 90, 300);
  patch('rgba(255,255,255,0.55)', 46, 60, 240);
  x.lineCap = 'round';
  const crack = (sx, sy, angle, len, width) => {
    x.lineWidth = width;
    x.strokeStyle = `rgba(255,255,255,${0.45 + Math.random() * 0.45})`;
    x.beginPath();

    let px = sx, py = sy, a = angle;
    const steps = 4 + Math.floor(Math.random() * 6);

      a += (Math.random() - 0.5) * 0.9;
      px += Math.cos(a) * len / steps;
      py += Math.sin(a) * len / steps;
      x.lineTo(px, py);
      if (width > 1.3 && Math.random() < 0.35) {
        x.stroke();
        crack(px, py, a + (Math.random() < 0.5 ? 0.9 : -0.9), len * 0.42, width * 0.6);
        x.lineWidth = width;
        x.strokeStyle = 'rgba(255,255,255,0.75)';
        x.beginPath();
        x.moveTo(px, py);
      }
    }
    x.stroke();
  };
  for (let i = 0; i < 32; i++) crack(Math.random() * c.width, Math.random() * c.height, Math.random() * Math.PI * 2, 160 + Math.random() * 420, 2 + Math.random() * 2.4);
  for (let i = 0; i < 2600; i++) {
    x.fillStyle = `rgba(255,255,255,${0.15 + Math.random() * 0.55})`;
    x.beginPath();
    x.arc(Math.random() * c.width, Math.random() * c.height, 0.6 + Math.random() * 1.8, 0, Math.PI * 2);

}

function loadImage(src) {

function cutSprite(sheet, [x, y, w, h, filter]) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d', { willReadFrequently: true });
  if (filter) ctx.filter = filter;
  ctx.drawImage(sheet, x, y, w, h, 0, 0, w, h);
  ctx.filter = 'none';
  const px = ctx.getImageData(0, 0, w, h);
  for (let i = 3; i < px.data.length; i += 4) px.data[i] = px.data[i] < 200 ? 0 : 255;
  ctx.putImageData(px, 0, 0);
  const texture = new THREE.CanvasTexture(c);
  texture.colorSpace = THREE.SRGBColorSpace;
  texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return { texture, aspect: h / w, url: c.toDataURL() };
}
// The icon sheet has a dark backdrop: flood-fill it away from the crop's edges.
function cutIcon(sheet, [x, y, w, h], light = false) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(sheet, x, y, w, h, 0, 0, w, h);
  const img = ctx.getImageData(0, 0, w, h), d = img.data;
  const isBackdrop = i => d[i + 3] < 30 || (light ? d[i] > 244 && d[i + 1] > 244 && d[i + 2] > 244 : d[i] < 62 && d[i + 1] < 66 && d[i + 2] < 82);
  const seen = new Uint8Array(w * h), stack = [];
  for (let px = 0; px < w; px++) stack.push(px, (h - 1) * w + px);
  for (let py = 0; py < h; py++) stack.push(py * w, py * w + w - 1);
  while (stack.length) {
    const p = stack.pop();
    if (seen[p] || !isBackdrop(p * 4)) continue;
    seen[p] = 1;
    d[p * 4 + 3] = 0;
    const px = p % w;
    if (px > 0) stack.push(p - 1);
    if (px < w - 1) stack.push(p + 1);
    if (p >= w) stack.push(p - w);
    if (p < w * (h - 1)) stack.push(p + w);
  }
  ctx.putImageData(img, 0, 0);
  const big = document.createElement('canvas');
  const upscale = Math.min(4, 900 / Math.max(w, h));
  big.width = w * upscale; big.height = h * upscale;
  const bx = big.getContext('2d');
  bx.imageSmoothingEnabled = true;
  bx.imageSmoothingQuality = 'high';
  if (!light) bx.filter = 'saturate(1.32) contrast(1.1) brightness(1.03)';
  bx.drawImage(c, 0, 0, big.width, big.height);
  const texture = new THREE.CanvasTexture(big);
  texture.colorSpace = THREE.SRGBColorSpace;
  texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return { texture, aspect: h / w, url: big.toDataURL() };
}

// Crops one bear from the sitting sheet, keeping only the shape connected to its center.
function cutConnected(sheet, [x, y, w, h]) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(sheet, x, y, w, h, 0, 0, w, h);
  const img = ctx.getImageData(0, 0, w, h), d = img.data;
  const keep = new Uint8Array(w * h), stack = [(h >> 1) * w + (w >> 1)];
  while (stack.length) {
    const p = stack.pop();
    if (keep[p] || d[p * 4 + 3] < 200) continue;
    keep[p] = 1;
    const px = p % w;
    if (px > 0) stack.push(p - 1);
    if (px < w - 1) stack.push(p + 1);
    if (p >= w) stack.push(p - w);
    if (p < w * (h - 1)) stack.push(p + w);
  }
  for (let p = 0; p < w * h; p++) d[p * 4 + 3] = keep[p] ? 255 : 0;
  ctx.putImageData(img, 0, 0);
  const texture = new THREE.CanvasTexture(c);
  texture.colorSpace = THREE.SRGBColorSpace;
  texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return { texture, aspect: h / w };
}

// One loose element per edge cell: shop, trees, lamp or snow, nudged away from the play area.
function looseEdgeCell(c, r, awayX, awayZ) {
  const x = cellX(c), z = cellZ(r), roll = rand(c, r);
  const dx = (rand(c, r, 1) - 0.2) * 0.22 * (awayX || 0) + (awayX ? 0 : (rand(c, r, 2) - 0.5) * 0.18);
  const dz = (rand(c, r, 3) - 0.2) * 0.22 * (awayZ || 0) + (awayZ ? 0 : (rand(c, r, 4) - 0.5) * 0.14);
  sidewalk(x, z);
  if (roll < 0.42) house(0, 0, x + dx, z + dz, 0, Math.floor(rand(c, r, 5) * 5), 0.84 + rand(c, r, 6) * 0.2, -(awayX || 0) * 0.85);
  else if (roll < 0.64) {
    tree(x + dx - 0.16, z + dz, 0.66 + rand(c, r, 7) * 0.3);
    tree(x + dx + 0.2, z + dz + 0.14, 0.5 + rand(c, r, 8) * 0.25);
  } else if (roll < 0.74) {
    tree(x + dx, z + dz, 0.8 + rand(c, r, 7) * 0.25);
    lamp(x + dx + 0.34, z + dz + 0.2);
  } else {
    if (rand(c, r, 10) < 0.5) bench(x + dx, z + dz, awayX ? -awayX * Math.PI / 2 : 0);
    else flowerBed(x + dx, z + dz);
    lamp(x + dx - 0.3, z + dz + 0.2);
  }
}

function buildOuterCity() {
  const gateCol = (COLS - 1) / 2, gateRow = (ROWS - 1) / 2;
  for (let c = -1; c <= COLS; c++) {
    if (c === gateCol) {
      sidewalk(cellX(c), cellZ(-1));
      snowPile(cellX(c), cellZ(-1));
      crosswalk(cellX(c), cellZ(-2), true);
    } else looseEdgeCell(c, -1, 0, -1);
    const x = cellX(c), z = cellZ(ROWS);
    sidewalk(x, z);
    if (c === gateCol) { snowPile(x, z); crosswalk(x, cellZ(ROWS + 1), true); }
    else if (c % 3 === 0) spectator((Math.abs(c) % 4) + 1, x, z);
    else if (rand(c, 91) < 0.55) tree(x + (rand(c, 92) - 0.5) * 0.3, z + 0.08, 0.52 + rand(c, 93) * 0.28);
    else if (c % 3 === 1) bench(x, z + 0.04);
    else flowerBed(x, z);
  }
  for (let r = 0; r < ROWS; r++) {
    if (r === gateRow) {
      sidewalk(cellX(-1), cellZ(r));
      sidewalk(cellX(COLS), cellZ(r));
      snowPile(cellX(-1), cellZ(r));
      snowPile(cellX(COLS), cellZ(r));
      crosswalk(cellX(-2), cellZ(r), false);
      crosswalk(cellX(COLS + 1), cellZ(r), false);
      continue;
    }
    looseEdgeCell(-1, r, -1, 0);
    looseEdgeCell(COLS, r, 1, 0);
  }
  for (let c = -10; c <= COLS + 9; c++) for (let r = -7; r <= ROWS + 6; r++) {
    if (c >= -1 && c <= COLS && r >= -1 && r <= ROWS) continue;
    if (c === gateCol || r === gateRow) continue;
    if (r > ROWS && r < ROWS + 3) { if (rand(c, r) > 0.82) tree(cellX(c), cellZ(r), 0.72); continue; }
    const roll = rand(c, r, 9);
    if (roll < 0.28) continue;
    sidewalk(cellX(c), cellZ(r));
    if (roll < 0.76) house(0, 0, cellX(c) + (rand(c, r, 1) - 0.5) * 0.2, cellZ(r) + (rand(c, r, 2) - 0.5) * 0.2, 0, Math.floor(rand(c, r, 5) * 5), 0.82 + rand(c, r, 6) * 0.25, r >= -1 && r <= ROWS ? (c < 0 ? 0.85 : -0.85) : 0);
    else tree(cellX(c), cellZ(r), 0.65 + rand(c, r, 7) * 0.4);
  }
}

function animateWorld(dt, time) {
  const p = snowGeo.attributes.position;
  for (let i = 0; i < SNOW_COUNT; i++) {
    let y = p.getY(i) - dt * (0.7 + (i % 5) * 0.12);
    if (y < 0) y = 9;
    p.setY(i, y);
    p.setX(i, p.getX(i) + Math.sin(time + i) * dt * 0.12);
  }
  p.needsUpdate = true;
  spectators.forEach(g => {
    const hop = Math.abs(Math.sin(time * 3.2 + g.userData.phase));
    g.position.y = hop * 0.09;
    g.rotation.z = Math.sin(time * 3.2 + g.userData.phase) * 0.08;
  });
}

  swish() { if (this.ctx) [84, 88, 91].forEach((n, i) => this.tone(n, this.ctx.currentTime + i * 0.04, 0.09, 'triangle', 0.12)); },
  creak() { if (this.ctx) [96, 94, 96].forEach((n, i) => this.tone(n, this.ctx.currentTime + i * 0.09, 0.06, 'square', 0.04)); },

function explode(bomb) {

function dangerSet(extra) {
  const d = new Set();
  G.bombs.forEach(b => blastCells(b.c, b.r, b.range).forEach(([c, r]) => d.add(key(c, r))));
  G.flames.forEach(f => f.cells.forEach(([c, r]) => d.add(key(c, r))));
  if (G.puddles) G.puddles.forEach(k => d.add(k));
  if (G.slides) G.slides.forEach(k => d.add(k));
  if (G.icicles) G.icicles.forEach(i => { if (!i.landed) d.add(key(i.c, i.r)); });
  if (extra) blastCells(extra[0], extra[1], extra[2]).forEach(([c, r]) => d.add(key(c, r)));
  return d;
}

// Breadth-first search; returns the first step toward the closest cell matching goal.
function firstStep(c, r, goal, avoid, extraBomb) {
  const seen = new Set([key(c, r)]);
  const queue = DIR_LIST.map(([dc, dr]) => [c + dc, r + dr, c + dc, r + dr, 1]);
  while (queue.length) {
    const [x, y, fx, fy, len] = queue.shift();
    if (seen.has(key(x, y)) || !walkable(x, y) || (extraBomb && extraBomb[0] === x && extraBomb[1] === y)) continue;
    seen.add(key(x, y));
    if (avoid && avoid.has(key(x, y))) continue;
    if (goal(x, y)) return { c: fx, r: fy, len };
    if (len < 12) DIR_LIST.forEach(([dc, dr]) => queue.push([x + dc, y + dr, fx, fy, len + 1]));
  }
  return null;
}

function canEscape(a, danger) {
  return firstStep(a.c, a.r, (x, y) => !danger.has(key(x, y)), null, [a.c, a.r]);
}

function stepTo(a, c, r) {
  a.toC = c; a.toR = r; a.t = 0; a.moving = true;
  const dx = c - a.c;
  a.facing = dx * 0.55;
}

const AI_ITEM_CHANCE = 0.85, AI_ITEM_RANGE = 6;
// Computer-bear brains get sharper each level. Level 1 keeps the original, evenly matched behaviour.
const AI_LEVELS = [
  { speed: 3.1, think: [0.35, 0.5], bomb: 0.6, react: true, hunt: 0 },
  { speed: 3.5, think: [0.25, 0.35], bomb: 0.75, react: false, hunt: 0.45 },
  { speed: 3.9, think: [0.15, 0.25], bomb: 0.9, react: false, hunt: 0.75 },
  { speed: 4.2, think: [0.1, 0.2], bomb: 0.95, react: false, hunt: 0.85 },
  { speed: 4.4, think: [0.08, 0.12], bomb: 1, react: false, hunt: 0.95 },

const aiProfile = () => AI_LEVELS[Math.min(LEVELS.indexOf(LEVEL), AI_LEVELS.length - 1)] || AI_LEVELS[0];
function aiTick(a, dt) {
  const danger = dangerSet();
  if (danger.has(key(a.c, a.r))) {
    if (aiProfile().react) { a.think -= dt; if (a.think > 0) return; }
    const out = firstStep(a.c, a.r, (x, y) => !danger.has(key(x, y)));
    if (out) stepTo(a, out.c, out.r);
    a.think = 0;
    return;
  }
  a.think -= dt;
  if (a.think > 0) return;
  const AI = aiProfile();
  a.think = AI.think[0] + Math.random() * AI.think[1];
  if (G.items.length && Math.random() < AI_ITEM_CHANCE) {
    const toItem = firstStep(a.c, a.r, (x, y) => G.items.some(i => i.c === x && i.r === y), danger);
    if (toItem && toItem.len <= AI_ITEM_RANGE) { stepTo(a, toItem.c, toItem.r); a.think = 0.05; return; }
  }
  const enemies = G.bears.filter(b => b !== a && b.alive);
  const blast = blastCells(a.c, a.r, a.range);
  const hitsEnemy = blast.some(([c, r]) => enemies.some(e => e.c === c && e.r === r));
  const hitsBlock = blast.some(([c, r]) => cellAt(c, r) === 'O');
  if ((hitsEnemy || hitsBlock) && a.active < a.maxBombs && Math.random() < AI.bomb) {
    if (canEscape(a, dangerSet([a.c, a.r, a.range])) && placeBomb(a)) { a.think = 0.15; return; }
  }
  const adjacentTarget = (x, y) => DIR_LIST.some(([dc, dr]) =>
    cellAt(x + dc, y + dr) === 'O' || G.items.some(i => i.c === x && i.r === y) || enemies.some(e => e.c === x + dc && e.r === y + dr));
  // Smarter bears go hunting: walk to a spot where their blast would reach the player.
  const prey = G.player;
  if (AI.hunt && prey && prey.alive && Math.random() < AI.hunt) {
    const [pc, pr] = nowCell(prey);
    const hunt = firstStep(a.c, a.r, (x, y) => blastCells(x, y, a.range).some(([c, r]) => c === pc && r === pr), danger);
    if (hunt) { stepTo(a, hunt.c, hunt.r); return; }
  }
  let step = Math.random() < 0.8 ? firstStep(a.c, a.r, adjacentTarget, danger) : null;
  if (!step) {
    const open = DIR_LIST.map(([dc, dr]) => [a.c + dc, a.r + dr]).filter(([x, y]) => walkable(x, y) && !danger.has(key(x, y)));
    if (open.length) { const [x, y] = open[Math.random() * open.length | 0]; step = { c: x, r: y }; }
  }
  if (step) stepTo(a, step.c, step.r);
}

function playerTick(a) {
  const d = held[held.length - 1] || tapped;

  const [dc, dr] = DIRS[d];
  a.facing = dc ? dc * 0.55 : a.facing;

  if (a.kick && ahead && !ahead.slide) { kickBomb(ahead, dc, dr); return; }
  if (walkable(a.c + dc, a.r + dr)) stepTo(a, a.c + dc, a.r + dr);
}

function updateBear(a, dt, time) {
  const g = a.group;
  if (a.frozen > 0) {
    a.frozen -= dt;
    if (a.frozen <= 0) {
      if (a.ice) { dynamic.remove(a.ice); a.ice = null; }
      if (a.alive) a.safe = SAFE_SECONDS;
      else {
        burst(g.position.x, g.position.z, 0xfaf4e8, 8);
        g.visible = false;
        if (a.tag) a.tag.visible = false;
        if (a.ring) a.ring.visible = false;
      }
    }
    return;
  }
  if (!a.alive) return;
  if (a.safe > 0) { a.safe -= dt; g.visible = a.safe <= 0 || Math.floor(time * 12) % 2 === 0; }
  if (a.slipSafe > 0) a.slipSafe -= dt;
  if (a.tp) { updateTeleport(a, dt, time); return; }
  if (a.chill > 0) {
    a.chill -= dt;
    const shiver = Math.sin(time * 40) * 0.02 * (a.chill < 0.5 ? 2 : 1);
    if (a.chillIce) a.chillIce.position.x = cellX(a.c) + shiver;
    if (a.chill <= 0) { unchill(a); Sound.crack ? Sound.crack() : Sound.place(); }
    if (a.ring) a.ring.position.set(cellX(a.c), 0.025, cellZ(a.r));
    return;
  }
  if (a.slip > 0) {
    a.slip -= dt;
    if (a.slip <= 0) clearSlipStars(a);
    g.position.set(cellX(a.c), 0, cellZ(a.r));
    g.rotation.z = 0;
    const left = Math.max(0, a.slip), spent = SLIP_SECONDS - left;
    if (spent < 0.14) poseBear(a, a.slipDir * spent * 3.5, Math.sin(spent / 0.14 * Math.PI) * 0.26);
    else if (left < 0.13) poseBear(a, 0, Math.sin(left / 0.13 * Math.PI) * 0.16);
    else {
      const landed = spent - 0.14;
      const bounce = landed < 0.3 ? Math.abs(Math.sin(landed / 0.3 * Math.PI * 2)) * (0.3 - landed) * 0.4 : 0;
      poseSitting(a, landed > 0.3 ? Math.sin(time * 9) * 0.035 : 0, bounce, landed < 0.1 ? 0.84 + landed * 1.6 : 1);
    }
    const sitTop = Math.min(1.3, a.info.W * 1.3) * SPRITES.sitting[a.info.num].aspect;
    (a.stars || []).forEach((st, i) => {
      const ang = time * 7 + i * 2.1;
      st.position.set(cellX(a.c) + Math.cos(ang) * 0.34, sitTop * Math.cos(SPRITE_TILT) + 0.08 + Math.sin(ang) * 0.06, cellZ(a.r) + sitTop * Math.sin(SPRITE_TILT) + Math.sin(ang) * 0.1);
    });
    if (a.ring) a.ring.position.set(cellX(a.c), 0.025, cellZ(a.r));
    if (a.tag) a.tag.position.set(cellX(a.c), a.info.H * Math.cos(SPRITE_TILT) + 0.2, cellZ(a.r) + a.info.H * Math.sin(SPRITE_TILT) - 0.04);
    return;
  }
  if (G.state === 'play') {
    if (!a.moving) a.isPlayer ? playerTick(a) : aiTick(a, dt);
    if (a.moving) {
      a.t += dt * a.speed * (a.sliding ? SLIDE_SPEED_BONUS : 1);
      if (a.t >= 1) {
        const dc = a.toC - a.c, dr = a.toR - a.r;
        a.c = a.toC; a.r = a.toR; a.t = 0; a.moving = false;
        trySlip(a);
        tryHole(a);
        if (trySlide(a, dc, dr)) { /* keeps sliding */ }
        else if (a.isPlayer && !(a.slip > 0) && !a.tp) playerTick(a);
      }
    }
  }
  const x = a.moving ? THREE.MathUtils.lerp(cellX(a.c), cellX(a.toC), a.t) : cellX(a.c);
  const z = a.moving ? THREE.MathUtils.lerp(cellZ(a.r), cellZ(a.toR), a.t) : cellZ(a.r);
  const stride = a.moving && !a.sliding ? Math.sin(time * 18) : 0;
  if (a.bump > 0) a.bump -= dt;
  const bump = a.bump > 0 ? Math.sin((0.25 - a.bump) / 0.25 * Math.PI) * 0.18 : 0;
  g.position.set(x, Math.abs(stride) * 0.05, z);
  g.rotation.z = 0;
  if (a.sliding) {
    poseBear(a, Math.sin(time * 16) * 0.16 - a.sliding[0] * 0.18, 0.04);
    if (Math.random() < dt * 14) burst(x, z, 0xe6f8ff, 1);
  } else poseBear(a, stride * 0.08 - a.facing * 0.1, bump);
  const breath = 1 + Math.sin(time * 2.2 + a.info.num) * 0.018;
  g.scale.set(2 - breath, breath, 2 - breath);
  if (a.ring) { a.ring.position.set(x, 0.025, z); a.ring.material.opacity = 0.65 + Math.sin(time * 5) * 0.25; }
  if (a.tag) a.tag.position.set(x, a.info.H * Math.cos(SPRITE_TILT) + 0.2, z + a.info.H * Math.sin(SPRITE_TILT) - 0.04);
}

function update(dt, time) {
  if (G.startIn > 0) {
    G.startIn -= dt;
    if (G.startIn <= 0) { G.state = 'play'; banner('開始！', 700); }
  }
  G.bears.forEach(a => updateBear(a, dt, time));
  if (G.state === 'play') collectItems();
  if (G.holes) G.holes.forEach(h => { h.mesh.rotation.z += dt * 1.4; });
  updateIcicles(dt);
  G.items.forEach(i => {
    i.grace -= dt;
    i.sprite.position.y = 0.42 + Math.sin(time * 4 + i.c) * 0.04;
  });
  if (G.state === 'play' || G.state === 'over') {
    [...G.bombs].forEach(b => {
      b.timer -= dt;
      updateBombSlide(b, dt);
      const urgent = b.timer < 1;
      b.group.scale.setScalar(1 + Math.sin(time * (urgent ? 22 : 8)) * (urgent ? 0.09 : 0.04));
      b.spark.scale.setScalar(0.85 + Math.sin(time * 24) * 0.35);
      if (b.timer <= 0) explode(b);
    });
    G.flames = G.flames.filter(f => {
      f.timer -= dt;
      const k = Math.max(0, f.timer / FLAME_SECONDS);
      f.meshes.forEach(m => m.scale.setScalar(m.geometry.type === 'SphereGeometry' ? 0.7 + (1 - k) * 0.5 : 1));
      [...G.items].forEach(i => { if (i.grace <= 0 && f.cells.some(([x, y]) => x === i.c && y === i.r)) removeItem(i); });
      if (G.state === 'play') G.bears.forEach(a => {
        if (!a.alive || a.frozen > 0 || a.safe > 0 || a.tp) return;
        const [c, r] = nowCell(a);
        if (f.cells.some(([x, y]) => x === c && y === r)) hurt(a);
      });
      if (f.timer <= 0) { f.meshes.forEach(m => dynamic.remove(m)); return false; }
      return true;
    });
  }
  G.pops = G.pops.filter(p => {
    p.life -= dt;
    p.sprite.position.y += dt * 0.7;
    p.sprite.material.opacity = Math.min(1, p.life * 3);
    if (p.life > 0) return true;
    dynamic.remove(p.sprite);
    return false;
  });
  G.bits = G.bits.filter(b => {
    const u = b.userData;
    u.life -= dt;
    u.vy -= 9 * dt;
    b.position.x += u.vx * dt;
    b.position.y = Math.max(0.05, b.position.y + u.vy * dt);
    b.position.z += u.vz * dt;
    b.rotation.x += dt * 8;
    b.scale.setScalar(Math.max(0.01, u.life / 0.7));
    if (u.life <= 0) { dynamic.remove(b); return false; }
    return true;
  });
}

const statIcon = (i, value = '') => `<span class="stat"><img src="${SPRITES.items[i]?.url || ''}" alt="">${value}</span>`;
function renderHud() {
  $('hud').innerHTML = G.bears.map(a => `
    <div class="chip${a.isPlayer ? ' me' : ''}${a.alive ? '' : ' out'}" style="--c:${a.info.css}">
      <b>${a.info.num}</b><span>${a.isPlayer ? escapeHtml(bearName(a.info.num)) : 'CPU'}</span>
      <i>${'♥'.repeat(Math.max(0, a.lives))}${'♡'.repeat(START_LIVES - Math.max(0, a.lives))}</i>
      ${a.isPlayer ? `<em>${statIcon(0, a.maxBombs)}${statIcon(1, a.range)}${statIcon(2, a.speedUps)}${a.kick ? statIcon(3) : ''}</em>` : ''}
    </div>`).join('');
}
let bannerTimer = 0;
function banner(text, ms) {
  const el = $('banner');
  el.textContent = text;
  el.hidden = false;
  clearTimeout(bannerTimer);
  bannerTimer = setTimeout(() => { el.hidden = true; }, ms);
}
function startGame(num) {
  G.chosen = num;
  Sound.unlock();
  held.length = 0;
  tapped = null;
  resetRound();
  $('menu').hidden = true;
  $('result').hidden = true;
  $('levels').hidden = true;
  document.body.classList.add('playing');
  focusGame();
  G.state = 'ready';
  G.startIn = 1.6;
  banner(`${LEVEL.name}：你是 ${num} 號，準備！`, 1600);
  Sound.playMusic(LEVEL.music);
}
function finish(won) {
  G.state = 'over';
  document.body.classList.remove('playing');
  Sound.stopMusic();
  Sound.jingle(won ? [72, 76, 79, 84] : [72, 67, 64, 60]);
  const levelIndex = LEVELS.indexOf(LEVEL);
  if (won) markCleared(levelIndex);
  const next = LEVELS[levelIndex + 1];
  const hasNext = !!(won && next && next.ready);
  // Simple run: a win jumps straight to the next level; a loss sends you back to level 1 with everything locked again.
  if (!won) { try { localStorage.removeItem(SAVE_KEY); } catch {} }
  ['nextLevel', 'toLevels', 'change'].forEach(id => { $(id).hidden = true; });
  $('again').hidden = hasNext;
  $('again').textContent = '從第一關開始';
  setTimeout(() => {
    $('resultTitle').textContent = won ? '你贏了！' : '差一點！';
    $('resultText').textContent = hasNext
      ? `馬上進入第 ${levelIndex + 2} 關：${next.name}！`
      : won ? '你打敗了所有電腦熊！下一關還在製作中，敬請期待。' : '你的三條命用完了，要從第一關重新開始喔。';
    $('result').hidden = false;
    if (hasNext) setTimeout(() => { if (!$('result').hidden) { LEVEL = next; startGame(G.chosen); } }, 2200);
  }, 900);
}
function showMenu() {
  G.state = 'menu';
  G.startIn = 0;
  document.body.classList.remove('playing');
  Sound.stopMusic();
  resetRound();
  $('result').hidden = true;
  $('levels').hidden = true;
  $('menu').hidden = false;
}
const NAMES_KEY = 'polar-bear-bomb-names';
function readNames() {
  try { return JSON.parse(localStorage.getItem(NAMES_KEY)) || {}; } catch { return {}; }
}
G.names = readNames();
const bearName = num => G.names[num] || BEAR_INFO[num].name;
const escapeHtml = t => String(t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
$('picks').innerHTML = Object.values(BEAR_INFO).map(b => `
  <button class="pick" data-num="${b.num}" type="button" aria-pressed="false" style="--c:${b.css}"><b>${b.num}</b><strong></strong><small>${b.shape}</small></button>`).join('');
function selectBear(num) {
  G.chosen = num;
  document.querySelectorAll('.pick').forEach(p => {
    const n = +p.dataset.num;
    p.setAttribute('aria-pressed', n === num);
    p.querySelector('strong').textContent = bearName(n);
  });
  $('playerName').value = bearName(num);
}
$('picks').addEventListener('click', e => { const p = e.target.closest('.pick'); if (p) selectBear(+p.dataset.num); });
$('playerName').addEventListener('input', () => {
  const pressed = document.querySelector('.pick[aria-pressed="true"] strong');
  if (pressed) pressed.textContent = $('playerName').value.trim() || BEAR_INFO[G.chosen].name;
});
$('nameForm').addEventListener('submit', e => {
  e.preventDefault();
  const typed = $('playerName').value.trim();
  if (typed) G.names[G.chosen] = typed; else delete G.names[G.chosen];
  try { localStorage.setItem(NAMES_KEY, JSON.stringify(G.names)); } catch {}
  $('playerName').blur();
  // The chosen bear stays for the whole run: always start from level 1.
  try { localStorage.removeItem(SAVE_KEY); } catch {}
  LEVEL = LEVELS[0];
  startGame(G.chosen);
});
selectBear(1);
function setPaused(on) {
  if (on && G.state !== 'play' && G.state !== 'ready') return;
  G.paused = on;
  $('pauseMenu').hidden = !on;
  held.length = 0;
  tapped = null;
  endTouchSteer();
  if (on) Sound.stopMusic();
  else if (G.state === 'play' || G.state === 'ready') { Sound.unlock(); Sound.playMusic(LEVEL.music); focusGame(); }
}
$('pause').addEventListener('click', e => { setPaused(true); e.currentTarget.blur(); });
$('resume').addEventListener('click', () => setPaused(false));
$('restart').addEventListener('click', () => { G.paused = false; $('pauseMenu').hidden = true; startGame(G.chosen); });
$('pauseLevels').addEventListener('click', () => { G.paused = false; $('pauseMenu').hidden = true; showLevels(); });
addEventListener('keydown', e => {
  if ((e.key === 'Escape' || e.key === 'p' || e.key === 'P') && e.target.tagName !== 'INPUT' && !e.repeat) setPaused(!G.paused);
});
function showLevels() {
  G.state = 'menu';
  G.startIn = 0;
  document.body.classList.remove('playing');
  Sound.stopMusic();
  $('menu').hidden = true;
  $('result').hidden = true;
  const cleared = readCleared();
  $('levelCards').innerHTML = LEVELS.map((l, i) => {
    const image = l.background
      ? `background-image:url('${l.background}');background-size:cover;background-position:center;`
      : `background-image:url('assets/style-grid.png');background-size:300% 200%;background-position:${l.thumb};`;
    const unlocked = l.ready && (i === 0 || cleared.includes(i - 1));
    const tag = !l.ready ? '<span class="tag soon">製作中</span>' : cleared.includes(i) ? '<span class="tag done">已過關</span>' : !unlocked ? '<span class="tag soon">未解鎖</span>' : '';
    return `<button class="level" data-level="${i}" type="button"${unlocked ? '' : ' disabled'}>
      <span class="thumb" style="${image}">${tag}</span>
      <strong>第 ${i + 1} 關｜${l.name}</strong><small>${l.rule}</small></button>`;
  }).join('');
  $('levels').hidden = false;
}
$('levelCards').addEventListener('click', e => {
  const b = e.target.closest('.level');
  if (b && !b.disabled) { LEVEL = LEVELS[+b.dataset.level]; startGame(G.chosen); }
});
$('backToBears').addEventListener('click', showMenu);
$('toLevels').addEventListener('click', showLevels);
$('nextLevel').addEventListener('click', () => { LEVEL = LEVELS[LEVELS.indexOf(LEVEL) + 1]; startGame(G.chosen); });
$('again').addEventListener('click', () => { LEVEL = LEVELS[0]; startGame(G.chosen); });
$('change').addEventListener('click', showMenu);
$('mute').addEventListener('click', e => {
  const m = Sound.toggle();
  e.currentTarget.textContent = m ? '聲音：關' : '聲音：開';
  e.currentTarget.blur();
});
document.querySelectorAll('[data-dir]').forEach(b => {
  const d = b.dataset.dir;
  b.addEventListener('pointerdown', e => { if (e.pointerType === 'touch') return; e.preventDefault(); pressDir(d); });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(t => b.addEventListener(t, e => { if (e.pointerType !== 'touch') releaseDir(d); }));
});
$('drop').addEventListener('pointerdown', e => { if (e.pointerType === 'touch') return; e.preventDefault(); if (G.state === 'play') placeBomb(G.player); });

// Touch: the whole left side steers relative to the d-pad's center, the right side drops bombs.
let touchSteer = null;
function setTouchDir(e) {
  const pad = $('pad').getBoundingClientRect();
  const dx = e.clientX - (pad.left + pad.width / 2), dy = e.clientY - (pad.top + pad.height / 2);
  if (Math.hypot(dx, dy) < 10) return;
  const dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
  if (dir === touchSteer.dir) return;
  if (touchSteer.dir) releaseDir(touchSteer.dir);
  touchSteer.dir = dir;
  pressDir(dir);
  document.querySelectorAll('#pad button').forEach(b => b.classList.toggle('on', b.dataset.dir === dir));
}
function endTouchSteer() {
  if (touchSteer?.dir) releaseDir(touchSteer.dir);
  touchSteer = null;
  document.querySelectorAll('#pad button.on').forEach(b => b.classList.remove('on'));
}
addEventListener('pointerdown', e => {
  if (e.pointerType !== 'touch' || G.paused || !document.body.classList.contains('playing') || e.target.closest('#mute, #pause, .overlay')) return;
  if (e.clientX < innerWidth / 2) {
    if (touchSteer) return;
    touchSteer = { id: e.pointerId, dir: null };
    setTouchDir(e);
  } else if (G.state === 'play') placeBomb(G.player);
});
addEventListener('pointermove', e => { if (touchSteer && e.pointerId === touchSteer.id) setTouchDir(e); });
// While playing, keep finger drags inside the game so the app/browser does not treat them as a swipe-to-close or back gesture.
const holdTouch = e => { if (document.body.classList.contains('playing') && !e.target.closest('#mute, #pause, .overlay') && e.cancelable) e.preventDefault(); };
['touchstart', 'touchmove'].forEach(t => document.addEventListener(t, holdTouch, { passive: false }));
['pointerup', 'pointercancel'].forEach(t => addEventListener(t, e => { if (touchSteer && e.pointerId === touchSteer.id) endTouchSteer(); }));

function resize() {
  const w = Math.min(innerWidth, innerHeight * 16 / 9), h = w * 9 / 16;
  renderer.setSize(w, h);
  camera.aspect = 16 / 9;
  const [cy, cz, look] = LEVEL.camera;
  camera.position.set(0, cy, cz);
  camera.lookAt(0, 0, look);
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
['gesturestart', 'gesturechange', 'gestureend'].forEach(t => addEventListener(t, e => e.preventDefault(), { passive: false }));
addEventListener('wheel', e => { if (e.ctrlKey || e.metaKey) e.preventDefault(); }, { passive: false });
resize();
let last = 0;
const revealTitle = () => document.body.classList.add('loaded');
setTimeout(revealTitle, 8000);
const fontReady = document.fonts?.load
  ? Promise.race([document.fonts.load('30px Huninn', '選一隻北極熊把三電腦都打敗幫你的取名字開始關方向鍵或移動空白放炸彈也可使用畫面按鈕'), new Promise(r => setTimeout(r, 4000))]).catch(() => {})
  : Promise.resolve();
Promise.all([loadSprites(), fontReady]).then(() => {
  revealTitle();
  $('picks').querySelectorAll('.pick').forEach(p => { p.querySelector('b').innerHTML = `<img src="${SPRITES.bears[p.dataset.num].url}" alt="">`; });
  showMenu();
  renderer.setAnimationLoop(ms => {
    const t = ms / 1000;
    const dt = Math.min(0.05, t - last);
    last = t;
    if (!G.paused) {
      update(dt, t);
      animateWorld(dt, t);
      if (G.shake > 0) { G.shake -= dt; camera.position.x = (Math.random() - 0.5) * 0.14 * Math.min(1, G.shake / 0.18); }
      else if (camera.position.x) camera.position.x = 0;
    }
    renderer.render(scene, camera);
  });
});
</script>
